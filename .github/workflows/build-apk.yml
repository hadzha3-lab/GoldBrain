name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
      - "scripts/**"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
      - "scripts/**"
      - "BETA_READINESS.md"

permissions:
  contents: read

concurrency:
  group: goldbrain-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build GoldBrain debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify read-only media safety
        shell: bash
        run: bash scripts/check-media-readonly.sh

      - name: Verify local-data backup privacy
        shell: bash
        run: bash scripts/check-local-data-privacy.sh

      - name: Verify offline beta contract
        shell: bash
        run: bash scripts/check-offline-beta.sh

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable on this runner"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare Russian OCR model
        shell: bash
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/rus.traineddata" \
            --output app/src/main/assets/tessdata/rus.traineddata
          test -s app/src/main/assets/tessdata/rus.traineddata

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Compile Android smoke tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest --stacktrace

      - name: Run clean-install Android smoke tests
        id: emulator_smoke
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            mkdir -p app/build/ci-smoke
            trap 'adb logcat -d -v threadtime > app/build/ci-smoke/logcat.txt 2>&1 || true; adb shell dumpsys activity processes > app/build/ci-smoke/activity-processes.txt 2>&1 || true; adb shell dumpsys package com.hadzha3.goldbrain > app/build/ci-smoke/package.txt 2>&1 || true' EXIT
            gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace

      - name: Upload Android smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldBrain-android-smoke-diagnostics
          path: |
            app/build/ci-smoke/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Require Android smoke success
        if: steps.emulator_smoke.outcome != 'success'
        shell: bash
        run: |
          echo "::error::Required Android emulator smoke tests failed. Inspect GoldBrain-android-smoke-diagnostics."
          exit 1

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GoldBrain-debug.apk

      - name: Verify APK size budget
        shell: bash
        run: bash scripts/check-apk-size.sh GoldBrain-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldBrain-debug-apk
          path: GoldBrain-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
