name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Test and build GoldBrain debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare Russian OCR model
        shell: bash
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/rus.traineddata" \
            --output app/src/main/assets/tessdata/rus.traineddata
          test -s app/src/main/assets/tessdata/rus.traineddata

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GoldBrain-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldBrain-debug-apk
          path: GoldBrain-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
