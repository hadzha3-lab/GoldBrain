name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
      - "scripts/**"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
      - "scripts/**"
      - "BETA_READINESS.md"

permissions:
  contents: read

concurrency:
  group: goldbrain-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build GoldBrain debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify read-only media safety
        shell: bash
        run: bash scripts/check-media-readonly.sh

      - name: Verify local-data backup privacy
        shell: bash
        run: bash scripts/check-local-data-privacy.sh

      - name: Verify offline beta contract
        shell: bash
        run: bash scripts/check-offline-beta.sh

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare Russian OCR model
        shell: bash
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/rus.traineddata" \
            --output app/src/main/assets/tessdata/rus.traineddata
          test -s app/src/main/assets/tessdata/rus.traineddata

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Compile Android smoke tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest --stacktrace

      - name: Run clean-install Android smoke tests
        id: emulator_smoke
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            mkdir -p app/build/ci-smoke
            trap 'adb logcat -d -v threadtime > app/build/ci-smoke/logcat.txt 2>&1 || true' EXIT
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.hadzha3.goldbrain.MainActivitySmokeTest --stacktrace
            gradle --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.hadzha3.goldbrain.GalleryIndexingSmokeTest --stacktrace

      - name: Upload Android smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoldBrain-android-smoke-diagnostics
          path: |
            app/build/ci-smoke/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Require Android smoke success
        if: steps.emulator_smoke.outcome != 'success'
        run: exit 1

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace

      - name: Build debug APKs
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare compact arm64 and universal APKs
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/debug"
          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -printf '%f %k KiB\n' | sort
          ARM64_APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*arm64-v8a*debug*.apk' | head -n 1)"
          UNIVERSAL_APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*universal*debug*.apk' | head -n 1)"
          test -n "$ARM64_APK"
          test -n "$UNIVERSAL_APK"
          cp "$ARM64_APK" GoldBrain-arm64-v8a-debug.apk
          cp "$UNIVERSAL_APK" GoldBrain-universal-debug.apk
          unzip -Z1 GoldBrain-arm64-v8a-debug.apk | grep -q '^lib/arm64-v8a/'
          if unzip -Z1 GoldBrain-arm64-v8a-debug.apk | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then exit 1; fi

      - name: Verify APK size reduction
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-apk-size.sh GoldBrain-arm64-v8a-debug.apk 55 "arm64-v8a APK"
          bash scripts/check-apk-size.sh GoldBrain-universal-debug.apk 150 "Universal APK"
          arm64_bytes="$(stat -c%s GoldBrain-arm64-v8a-debug.apk)"
          universal_bytes="$(stat -c%s GoldBrain-universal-debug.apk)"
          test $((universal_bytes - arm64_bytes)) -ge $((20 * 1024 * 1024))

      # API 29 is Android 10. This is deliberately a real package-manager install
      # of the universal APK, not only a compile/minSdk check.
      - name: Verify universal APK installs on Android 10
        id: android10_install
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: Nexus 6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            adb install -r GoldBrain-universal-debug.apk
            adb shell pm path com.hadzha3.goldbrain | grep -q '^package:'
            adb shell am start -W -n com.hadzha3.goldbrain/.MainActivity
            sleep 3
            adb shell pidof com.hadzha3.goldbrain

      - name: Require Android 10 install success
        if: steps.android10_install.outcome != 'success'
        shell: bash
        run: |
          echo "::error::Universal APK failed real install/launch on Android 10 (API 29)."
          exit 1

      - name: Upload compact arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldBrain-arm64-v8a-debug-apk
          path: GoldBrain-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: GoldBrain-universal-debug-apk
          path: GoldBrain-universal-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
